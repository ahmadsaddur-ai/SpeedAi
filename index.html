
<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ChatGPT - SpeedAi</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #212121; color: #ececec; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        /* Oberer Bereich / Header */
        .chat-header { padding: 12px 16px; font-weight: 600; font-size: 16px; color: #b4b4b4; border-bottom: 1px solid #2f2f2f; background-color: #212121; display: flex; justify-content: space-between; align-items: center; }
        
        /* Chatverlauf (nimmt den Platz in der Mitte ein und scrollt) */
        #chat-box { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 16px; padding-bottom: 80px; }

        /* Nachrichten-Design */
        .message { display: flex; gap: 12px; line-height: 1.5; font-size: 15px; max-width: 100%; }
        .avatar { width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 13px; flex-shrink: 0; }
        .message.user .avatar { background-color: #5436da; color: #fff; }
        .message.ai .avatar { background-color: #10a37f; color: #fff; }
        .content { word-break: break-word; margin-top: 4px; }

        /* Eingabebereich fixiert am unteren Bildschirmrand wie bei ChatGPT */
        .input-container { position: fixed; bottom: 0; left: 0; width: 100%; padding: 12px 16px; background-color: #212121; border-top: 1px solid #2f2f2f; }
        .input-box { background-color: #2f2f2f; border-radius: 24px; padding: 8px 12px; display: flex; align-items: center; border: 1px solid #424242; max-width: 800px; margin: 0 auto; }
        .input-box input { flex: 1; background: transparent; border: none; outline: none; color: #fff; font-size: 16px; padding: 4px 8px; }
        .input-box button { background: #10a37f; border: none; color: #fff; border-radius: 50%; width: 36px; height: 36px; cursor: pointer; display: flex; align-items: center; justify-content: center; margin-left: 6px; flex-shrink: 0; }
        .mic-btn { background: #424242 !important; }
        .mic-btn.active { background: #e53935 !important; }
    </style>
</head>
<body>

    <div class="chat-header">
        <span>ChatGPT <span style="font-size:11px; color:#10a37f;">(SpeedAi)</span></span>
        <span onclick="location.reload()" style="font-size: 14px; cursor: pointer; color: #888;">🔄 Neu</span>
    </div>

    <div id="chat-box">
        <div class="message ai">
            <div class="avatar">GPT</div>
            <div class="content">Hallo! Ich bin bereit. Schreibe mir etwas oder tippe auf das Mikrofon.</div>
        </div>
    </div>

    <div class="input-container">
        <div class="input-box">
            <input type="text" id="user-input" placeholder="Nachricht an ChatGPT..." onkeydown="if(event.key==='Enter') sendText()">
            <button id="mic-btn" class="mic-btn" onclick="toggleVoice()">🎙️</button>
            <button onclick="sendText()">➔</button>
        </div>
    </div>

    <script>
        let recognition;
        let isVoiceActive = false;

        function sprich(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const msg = new SpeechSynthesisUtterance(text);
                msg.lang = 'de-DE';
                msg.onend = function() {
                    if (isVoiceActive) starteZuhören();
                };
                window.speechSynthesis.speak(msg);
            }
        }

        function sendText() {
            const input = document.getElementById('user-input');
            const text = input.value.trim();
            if (!text) return;

            addMsg('Du', text, 'user');
            input.value = '';

            verarbeiteAnfrage(text);
        }

        function toggleVoice() {
            const btn = document.getElementById('mic-btn');
            isVoiceActive = !isVoiceActive;

            if (isVoiceActive) {
                btn.classList.add('active');
                starteZuhören();
            } else {
                btn.classList.remove('active');
                if (recognition) recognition.stop();
                window.speechSynthesis.cancel();
            }
        }

        function starteZuhören() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) return;

            recognition = new SpeechRecognition();
            recognition.lang = 'de-DE';
            recognition.start();

            recognition.onresult = function(event) {
                const text = event.results[0][0].transcript;
                addMsg('Du', text, 'user');
                verarbeiteAnfrage(text);
            };
        }

        function verarbeiteAnfrage(eingabe) {
            const text = eingabe.toLowerCase();
            let antwort = "";

            if (text.includes("hallo") || text.includes("hi")) {
                antwort = "Hallo! Wie kann ich dir heute weiterhelfen?";
            } else if (text.includes("wer bist du")) {
                antwort = "Ich bin dein persönlicher Assistent im ChatGPT-Design.";
            } else if (text.includes("wie gehts")) {
                antwort = "Mir geht's hervorragend! Wie läuft dein Tag?";
            } else {
                antwort = "Das ist ein spannender Punkt! Erzähl mir gerne mehr dazu.";
            }

            setTimeout(() => {
                addMsg('GPT', antwort, 'ai');
                if (isVoiceActive) sprich(antwort);
            }, 400);
        }

        function addMsg(sender, text, type) {
            const box = document.getElementById('chat-box');
            const avatarText = type === 'user' ? 'U' : 'GPT';
            
            box.innerHTML += `
                <div class="message ${type}">
                    <div class="avatar">${avatarText}</div>
                    <div class="content">${text}</div>
                </div>
            `;
            box.scrollTop = box.scrollHeight;
        }
    </script>

</body>
</html>
