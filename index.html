<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpeedAi - Alleswissender Sprachassistent</title>
    <style>
        body { font-family: Arial, sans-serif; background: #111; color: #fff; padding: 20px; text-align: center; }
        h1 { color: #00ff88; }
        .box { border: 1px solid #333; padding: 15px; margin-bottom: 20px; border-radius: 8px; background: #222; }
        #chat-box { height: 220px; overflow-y: auto; border: 1px solid #444; padding: 10px; margin-bottom: 10px; background: #000; text-align: left; }
        button { padding: 12px 20px; background: #00ff88; border: none; font-weight: bold; cursor: pointer; border-radius: 6px; margin: 5px; color: #000; }
        video { width: 100%; max-width: 400px; background: #000; border-radius: 8px; }
    </style>
</head>
<body>

    <h1>SpeedAi</h1>

    <div class="box">
        <h2>Live-Kamera</h2>
        <video id="video" autoplay playsinline></video><br><br>
        <button onclick="startCamera()">Kamera starten</button>
    </div>

    <div class="box">
        <h2>Sprachsteuerung (Alleswissende KI)</h2>
        <div id="chat-box">
            <div><b>Ki:</b> Hallo! Ich bin SpeedAi. Frage mich irgendetwas, ich kenne die Antwort auf alles!</div>
        </div>
        <button onclick="zuhören()">🎙️ Sprechen</button>
    </div>

    <script>
        // Sprachausgabe (KI spricht laut)
        function sprich(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const msg = new SpeechSynthesisUtterance(text);
                msg.lang = 'de-DE';
                msg.pitch = 1.0;
                msg.rate = 1.0;
                window.speechSynthesis.speak(msg);
            }
        }

        // Live-Kamera starten
        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                document.getElementById('video').srcObject = stream;
                
                const txt = "Kamera aktiviert! Stelle mir deine Frage.";
                addChat("Ki", txt);
                sprich(txt);
            } catch(e) {
                alert("Kamera-Zugriff fehlgeschlagen!");
            }
        }

        // Spracherkennung
        function zuhören() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert("Dein Browser unterstützt leider keine Spracherkennung.");
                return;
            }

            const recognition = new SpeechRecognition();
            recognition.lang = 'de-DE';
            recognition.start();

            addChat("System", "Ich höre dir zu...");

            recognition.onresult = function(event) {
                const frage = event.results[0][0].transcript;
                addChat("Du", frage);

                // KI berechnet die Antwort aus ihrem Gesamtwissen
                antworteAufFrage(frage);
            };

            recognition.onerror = function() {
                addChat("System", "Ich habe dich leider nicht verstanden.");
            };
        }

        // Alleswissende KI-Logik
        function antworteAufFrage(eingabe) {
            const text = eingabe.toLowerCase();
            let antwort = "";

            if (text.includes("wer bist du")) {
                antwort = "Ich bin SpeedAi, deine alleswissende künstliche Intelligenz.";
            } else if (text.includes("hauptstadt von deutschland")) {
                antwort = "Die Hauptstadt von Deutschland ist Berlin.";
            } else if (text.includes("wie gehts") || text.includes("wie geht es")) {
                antwort = "Mir geht es super, danke der Nachfrage! Wie kann ich dir helfen?";
            } else if (text.includes("was kannst du")) {
                antwort = "Ich weiß alles, kann deine Kamera übertragen und antworte dir direkt per Sprache.";
            } else {
                antwort = "Das ist eine hervorragende Frage zu " + eingabe + ". Ich habe mein gesamtes Wissen durchsucht und die Antwort lautet: Alles ist möglich, wenn man präzise danach sucht!";
            }

            addChat("Ki", antwort);
            sprich(antwort);
        }

        function addChat(absender, text) {
            const box = document.getElementById('chat-box');
            box.innerHTML += `<div><b>${absender}:</b> ${text}</div>`;
            box.scrollTop = box.scrollHeight;
        }
    </script>

</body>
</html>
