<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpeedAi - Assistent</title>
    <style>
        body { font-family: Arial, sans-serif; background: #111; color: #fff; padding: 20px; }
        h1 { color: #00ff88; }
        .box { border: 1px solid #333; padding: 15px; margin-bottom: 20px; border-radius: 8px; background: #222; }
        #chat-box { height: 200px; overflow-y: auto; border: 1px solid #444; padding: 10px; margin-bottom: 10px; background: #000; }
        input { width: 70%; padding: 8px; }
        button { padding: 8px 15px; background: #00ff88; border: none; font-weight: bold; cursor: pointer; }
        video { width: 100%; max-width: 400px; background: #000; border-radius: 8px; }
    </style>
</head>
<body>

    <h1>SpeedAi</h1>

    <div class="box">
        <h2>Live-Kamera</h2>
        <video id="video" autoplay playsinline></video><br><br>
        <button onclick="startCamera()">Kamera starten</button>
    </div>

    <div class="box">
        <h2>Chat & Sprachassistent</h2>
        <div id="chat-box">
            <div><b>Ki:</b> Hallo! Ich bin SpeedAi und spreche laut mit dir.</div>
        </div>
        <input type="text" id="userInput" placeholder="Nachricht schreiben...">
        <button onclick="sendMsg()">Senden</button>
    </div>

    <script>
        // Sprachausgabe (KI redet laut)
        function sprich(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const msg = new SpeechSynthesisUtterance(text);
                msg.lang = 'de-DE';
                window.speechSynthesis.speak(msg);
            }
        }

        // Live-Kamera starten
        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                document.getElementById('video').srcObject = stream;
                
                const txt = "Live-Kamera gestartet! Ich höre und sehe dich.";
                addChat("Ki", txt);
                sprich(txt);
            } catch(e) {
                alert("Kamera-Zugriff fehlgeschlagen!");
            }
        }

        // Nachricht senden
        function sendMsg() {
            const input = document.getElementById('userInput');
            const val = input.value;
            if(!val) return;

            addChat("Du", val);
            input.value = "";

            setTimeout(() => {
                const antwort = "Ich habe verstanden: " + val;
                addChat("Ki", antwort);
                sprich(antwort);
            }, 500);
        }

        function addChat(absender, text) {
            const box = document.getElementById('chat-box');
            box.innerHTML += `<div><b>${absender}:</b> ${text}</div>`;
            box.scrollTop = box.scrollHeight;
        }
    </script>

</body>
</html>
