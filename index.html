<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SpeedAi - Assistent</title>
  <style>
    body { font-family: Arial, sans-serif; background: #121212; color: white; text-align: center; margin: 0; padding: 20px; }
    h1 { color: #00ff88; }
    .box { border: 1px solid #333; padding: 15px; margin: 10px auto; max-width: 500px; background: #1e1e1e; border-radius: 8px; }
    #chat-box { height: 200px; overflow-y: auto; text-align: left; background: #000; padding: 10px; margin-bottom: 10px; border-radius: 5px; }
    input { width: 70%; padding: 8px; border-radius: 4px; border: none; }
    button { padding: 8px 15px; background: #00ff88; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
    video { width: 100%; max-width: 400px; border-radius: 8px; background: #000; }
  </style>
</head>
<body>

  <h1>SpeedAi</h1>

  <!-- Live Kamera Bereich -->
  <div class="box">
    <h3>Live-Kamera</h3>
    <video id="webcam" autoplay playsinline></video>
    <br><br>
    <button onclick="startCamera()">Kamera starten</button>
  </div>

  <!-- Chat Bereich -->
  <div class="box">
    <h3>Chat & Sprachassistent</h3>
    <div id="chat-box">
      <p><b>Ki:</b> Hallo! Wie kann ich dir heute helfen?</p>
    </div>
    <input type="text" id="userInput" placeholder="Nachricht schreiben...">
    <button onclick="sendMessage()">Senden</button>
  </div>

  <script>
    function sendMessage() {
      let input = document.getElementById('userInput');
      let chat = document.getElementById('chat-box');
      if (input.value.trim() !== "") {
        chat.innerHTML += "<p><b>Du:</b> " + input.value + "</p>";
        input.value = "";
        chat.scrollTop = chat.scrollHeight;
      }
    }

    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: true });
        document.getElementById('webcam').srcObject = stream;
      } catch (err) {
        alert("Kamera-Zugriff fehlgeschlagen: " + err);
      }
    }
  </script>

</body>
</html>
